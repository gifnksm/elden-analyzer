name: CD

on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+"
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  build-release-assets:
    name: Build artifacts for x86_64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup install
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: x86_64-unknown-linux-gnu

      - name: Setup build environment
        run: .github/ci-scripts/setup-build-ubuntu

      - name: Build artifact
        run: ./scripts/build-dist --target "x86_64-unknown-linux-gnu"
        shell: bash

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: artifact-x86_64-unknown-linux-gnu
          path: target/dist/*

  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    needs:
      - build-release-assets
    permissions:
      contents: write
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: artifact-*
          path: target/dist
          merge-multiple: true

      - name: Releasing assets
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: target/dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cd-complete:
    needs:
      - build-release-assets
      - release
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    steps:
      - name: CD complete
        run: |
          if ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}; then
            echo "CD succeeded"
          else
            echo "CD failed"
            exit 1
          fi
        shell: bash
