name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup install
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: just
      - run: just ci-rustfmt
        shell: bash

  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup install
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: just,cargo-hack
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Setup build environment
        run: ./.github/ci-scripts/setup-build-ubuntu
      - run: just ci-check
        shell: bash

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup install
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: just,cargo-hack
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Setup build environment
        run: ./.github/ci-scripts/setup-build-ubuntu
      - run: just ci-clippy
        shell: bash

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup install
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: just,cargo-hack
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Setup build environment
        run: ./.github/ci-scripts/setup-build-ubuntu
      - run: just ci-rustdoc
        shell: bash

  sync-rdme:
    name: Sync Readme
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup install
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: just,cargo-hack,cargo-sync-rdme
      - uses: Swatinem/rust-cache@v2.9.3
      - run: rustup toolchain install nightly --profile minimal
        shell: bash
      - run: just ci-sync-rdme
        shell: bash

  machete:
    name: Machete
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup install
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: just,cargo-machete
      - uses: Swatinem/rust-cache@v2.9.3
      - run: just ci-machete
        shell: bash

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup install
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Setup build environment
        run: ./.github/ci-scripts/setup-build-ubuntu
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: just,cargo-hack
      - run: just ci-test
        shell: bash

  coverage:
    name: Coverage (test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup install
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: just,cargo-llvm-cov
      - name: Setup build environment
        run: ./.github/ci-scripts/setup-build-ubuntu
      - run: just ci-coverage
        shell: bash
      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/codecov.json
          fail_ci_if_error: false

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check workflow files
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "::add-matcher::.github/actionlint-matcher.json"
          ./actionlint -color
        shell: bash

  ci-complete:
    needs:
      - rustfmt
      - check
      - clippy
      - rustdoc
      - sync-rdme
      - machete
      - test
      - coverage
      - actionlint
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    steps:
      - name: CI complete
        run: |
          if ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}; then
            echo "CI succeeded"
          else
            echo "CI failed"
            exit 1
          fi
        shell: bash
